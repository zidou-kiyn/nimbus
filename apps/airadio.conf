# AIradio configuration for kejilion/apps
# Official: https://github.com/moli-xia/AIradio

# --- 基础信息 / Basic Information ---
local app_id="airadio"
local app_name="AIradio"
local app_text="AI 驱动的在线电台，可制作节目、生成配音并管理音乐播放。"
local app_url="https://github.com/moli-xia/AIradio"
local docker_name="airadio"
local docker_port="4177"
local app_size="2"

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local app_dir="/home/docker/airadio"
    local admin_password

    mkdir -p "${app_dir}/data/audio" "${app_dir}/data/sound-effects"
    cd "${app_dir}" || return 1

    if [ -f .env ]; then
        admin_password=$(sed -n 's/^AIRADIO_ADMIN_PASSWORD=//p' .env | head -n 1)
    fi

    if [ -z "${admin_password}" ]; then
        admin_password=$(openssl rand -hex 16 2>/dev/null || head /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 32)
        cat > .env <<ENV
AIRADIO_ADMIN_USER=admin
AIRADIO_ADMIN_PASSWORD=${admin_password}
ENV
        chmod 600 .env
    fi

    cat <<'YAML' > docker-compose.yml
services:
  airadio:
    image: superneed/airadio:latest
    container_name: airadio
    restart: unless-stopped
    ports:
      - "4177:4177"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      AIRADIO_API_HOST: 0.0.0.0
      AIRADIO_API_PORT: 4177
      AIRADIO_STORAGE_DIR: /data
      AIRADIO_ADMIN_USER: ${AIRADIO_ADMIN_USER}
      AIRADIO_ADMIN_PASSWORD: ${AIRADIO_ADMIN_PASSWORD}
    volumes:
      - ./data:/data
YAML

    sed -i "s/4177:4177/${docker_port}:4177/g" docker-compose.yml
    docker compose --env-file .env up -d

    echo "AIradio 安装完成。"
    echo "访问地址：http://服务器IP:${docker_port}"
    echo "管理员用户名：admin"
    echo "管理员密码：${admin_password}"
    echo "请妥善保存密码；配置和节目数据位于 ${app_dir}/data。"
    check_docker_app_ip
}

docker_app_update() {
    cd /home/docker/airadio || return 1
    docker compose --env-file .env pull
    docker compose --env-file .env up -d
    echo "AIradio 已更新至最新镜像。"
}

docker_app_uninstall() {
    cd /home/docker/airadio || return 1
    docker compose --env-file .env down --rmi all
    rm -rf /home/docker/airadio
    echo "AIradio 已卸载，配置和节目数据已删除。"
}

# --- 注册 / Registration ---
docker_app_plus
