# EasyTier Web Console Configuration for kejilion/apps
# Official: https://github.com/EasyTier/EasyTier

# --- 基础信息 / Basic Information ---
local app_id="easytier"
local app_name="EasyTier"
local app_text="简单、安全、去中心化的异地组网方案，支持 NAT 穿透、Web 管理与 WireGuard"
local app_url="https://github.com/EasyTier/EasyTier"
local docker_name="easytier"
local docker_port="${docker_port:-11211}"
local app_size="1"

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local app_dir="/home/docker/easytier"
    local server_ip

    mkdir -p "${app_dir}/data"
    cd "${app_dir}" || return 1

    server_ip=$(curl -s4 --max-time 5 ip.sb 2>/dev/null || curl -s4 --max-time 5 ifconfig.me 2>/dev/null || true)
    server_ip=${server_ip:-YOUR_SERVER_IP}

    cat <<EOF > docker-compose.yml
services:
  easytier:
    image: easytier/easytier:latest
    container_name: ${docker_name}
    restart: unless-stopped
    entrypoint: ["/sbin/tini", "--", "easytier-web-embed"]
    command: >-
      --api-server-port 11211
      --api-host http://${server_ip}:${docker_port}
      --config-server-port 22020
      --config-server-protocol udp
      --db /data/et.db
    ports:
      - "${docker_port}:11211"
      - "22020:22020/udp"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
EOF

    docker compose up -d

    echo "等待 EasyTier Web 控制台启动..."
    local ready="false"
    local i
    for i in $(seq 1 20); do
        if curl -fsS --max-time 3 "http://127.0.0.1:${docker_port}/" >/dev/null 2>&1; then
            ready="true"
            break
        fi
        sleep 2
    done

    if [ "${ready}" != "true" ]; then
        echo "EasyTier Web 控制台启动超时，请运行 docker logs ${docker_name} 查看日志。"
        return 1
    fi

    echo "安装完成 / Install Complete"
    check_docker_app_ip
    echo "配置下发地址: udp://${server_ip}:22020/<控制台用户名>"
    echo "默认账户: admin / admin、user / user，请登录后立即修改密码。"
    echo "节点接入示例: easytier-core -w udp://${server_ip}:22020/<控制台用户名>"
    echo "请确认防火墙已放行 22020/UDP。"
}

docker_app_update() {
    local app_dir="/home/docker/easytier"
    cd "${app_dir}" || return 1
    docker compose pull
    docker compose up -d
    echo "更新完成 / Update Complete"
}

docker_app_uninstall() {
    local app_dir="/home/docker/easytier"
    cd "${app_dir}" || return 1
    docker compose down --rmi all
    rm -rf "${app_dir}"
    echo "卸载完成 / Uninstall Complete"
}

# --- 注册 / Registration ---
docker_app_plus
