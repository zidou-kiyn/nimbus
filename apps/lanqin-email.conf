# LanQin Email all-in-one deployment: https://github.com/LanQin996/LanQin-Email
local app_id="lanqin-email"
local app_name="LanQin Email 蓝钦邮件"
local app_text="自托管邮件系统，支持 Webmail、多域名、外部 IMAP 与细粒度权限；需配置邮件 DNS 和 TLS"
local app_url="https://github.com/LanQin996/LanQin-Email"
local docker_name="lanqin-email"
local docker_port="18088"
local app_size="3"

lanqin_email_owned_dir() {
    local app_dir="/home/docker/lanqin-email" entry
    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ] ||
       [ -L "$app_dir/.kejilion-app" ] ||
       [ "$(cat "$app_dir/.kejilion-app" 2>/dev/null)" != "lanqin-email" ]; then
        echo "未找到 LanQin Email 的安装记录，拒绝操作已有目录" >&2
        return 1
    fi
    for entry in .env docker-compose.yml data mail dkim certs; do
        if [ -L "$app_dir/$entry" ]; then
            echo "应用文件或数据目录是符号链接，拒绝操作: $entry" >&2
            return 1
        fi
    done
}

lanqin_email_wait_ready() {
    local attempt state
    for attempt in $(seq 1 60); do
        state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$docker_name" 2>/dev/null)"
        if [ "$state" = "healthy" ]; then
            return 0
        fi
        sleep 2
    done
    echo "启动检查超时，配置和数据已保留。请查看 docker logs $docker_name 后重试。" >&2
    return 1
}

docker_app_install() {
    local app_dir="/home/docker/lanqin-email"
    local hostname="${LANQIN_PUBLIC_HOSTNAME:-}" base_url="${LANQIN_PUBLIC_BASE_URL:-}"
    local admin_email="${LANQIN_ADMIN_EMAIL:-}" password secret imap_secret allow_http=false
    local cert_file="${LANQIN_TLS_CERT_FILE:-}" key_file="${LANQIN_TLS_KEY_FILE:-}"

    if [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入" >&2
        return 1
    fi
    if [ -e "$app_dir" ]; then
        lanqin_email_owned_dir || return 1
        if [ -f "$app_dir/.env" ] && [ -f "$app_dir/docker-compose.yml" ]; then
            docker_app_update
            return $?
        fi
        echo "安装目录不完整，请检查后重试；不会覆盖已有配置" >&2
        return 1
    fi
    if docker container inspect "$docker_name" >/dev/null 2>&1; then
        echo "同名容器已存在，拒绝覆盖" >&2
        return 1
    fi
    if ! [[ "$docker_port" =~ ^[0-9]+$ ]] ||
       [ "$docker_port" -lt 1 ] || [ "$docker_port" -gt 65535 ] ||
       [[ "$docker_port" =~ ^0 ]] ||
       [[ " 25 465 587 993 995 " == *" $docker_port "* ]]; then
        echo "Web 端口无效或与邮件端口冲突" >&2
        return 1
    fi
    if [ -z "$hostname" ] && [ "${KJ_APP_NONINTERACTIVE:-}" != "1" ]; then
        read -r -p "邮件服务器域名（例如 mail.example.com，不含协议）: " hostname || return 1
    fi
    if [ ${#hostname} -gt 253 ] ||
       ! [[ "$hostname" =~ ^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$ ]]; then
        echo "需要有效邮件域名；非交互安装请设置 LANQIN_PUBLIC_HOSTNAME" >&2
        return 1
    fi
    if [ -z "$base_url" ] && [ "${KJ_APP_NONINTERACTIVE:-}" != "1" ]; then
        read -r -p "Webmail 地址（建议 HTTPS 反代，默认 https://${hostname}）: " base_url || return 1
    fi
    base_url="${base_url:-https://${hostname}}"
    if ! [[ "$base_url" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]]; then
        echo "Webmail 地址必须为 http(s)://域名[:端口]，不能包含路径" >&2
        return 1
    fi
    admin_email="${admin_email:-admin@${hostname#*.}}"
    if ! [[ "$admin_email" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$ ]]; then
        echo "管理员邮箱格式无效" >&2
        return 1
    fi
    if [ -n "$cert_file$key_file" ] &&
       { [ ! -f "$cert_file" ] || [ ! -r "$cert_file" ] ||
         [ ! -f "$key_file" ] || [ ! -r "$key_file" ]; }; then
        echo "LANQIN_TLS_CERT_FILE 和 LANQIN_TLS_KEY_FILE 必须同时指向可读证书文件" >&2
        return 1
    fi
    [[ "$base_url" == http://* ]] && allow_http=true
    # Hex avoids Compose interpolation and shell-sensitive characters in .env.
    password="$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" || return 1
    secret="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" || return 1
    imap_secret="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" || return 1
    [ ${#password} -eq 48 ] && [ ${#secret} -eq 64 ] && [ ${#imap_secret} -eq 64 ] || return 1

    mkdir -m 700 -- "$app_dir" || return 1
    printf '%s\n' lanqin-email > "$app_dir/.kejilion-app" || return 1
    mkdir -p "$app_dir/data" "$app_dir/mail" "$app_dir/dkim" "$app_dir/certs" || return 1
    (umask 077; cat > "$app_dir/.env" <<EOF
LANQIN_PUBLIC_HOSTNAME=${hostname}
LANQIN_PUBLIC_BASE_URL=${base_url%/}
LANQIN_ADMIN_EMAIL=${admin_email}
LANQIN_ADMIN_PASSWORD=${password}
LANQIN_ADDR=127.0.0.1:8080
LANQIN_DATA_DIR=/data
LANQIN_DB_DRIVER=sqlite
LANQIN_DB_PATH=/data/lanqin.db
LANQIN_MAILDIR_ROOT=/var/mail/vhosts
LANQIN_SMTP_HOST=127.0.0.1
LANQIN_SMTP_PORT=25
LANQIN_TRUSTED_PROXY_COUNT=1
LANQIN_ALLOW_INSECURE_HTTP=${allow_http}
LANQIN_OPEN_REGISTRATION=false
LANQIN_NOTIFICATION_SECRET_KEY=${secret}
LANQIN_EXTERNAL_IMAP_SECRET_KEY=${imap_secret}
TZ=Asia/Shanghai
EOF
    ) || return 1
    if [ -n "$cert_file" ]; then
        cp -- "$cert_file" "$app_dir/certs/fullchain.pem" || return 1
        cp -- "$key_file" "$app_dir/certs/privkey.pem" || return 1
        chmod 600 "$app_dir/certs/privkey.pem" || return 1
        printf '%s\n' 'LANQIN_TLS_CERT_FILE=/certs/fullchain.pem' 'LANQIN_TLS_KEY_FILE=/certs/privkey.pem' >> "$app_dir/.env" || return 1
    fi
    cat > "$app_dir/docker-compose.yml" <<EOF
services:
  lanqin-email:
    image: ghcr.io/lanqin996/lanqin-email:latest
    container_name: ${docker_name}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${docker_port}:80"
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      - ./dkim:/var/lib/rspamd/dkim
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/readyz >/dev/null && postfix status >/dev/null 2>&1 && doveadm service status >/dev/null 2>&1 && rspamadm control stat >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
EOF
    cd "$app_dir" || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    lanqin_email_wait_ready || return 1
    echo "LanQin Email 安装完成。管理员: $admin_email"
    echo "初始随机密码保存在 $app_dir/.env 的 LANQIN_ADMIN_PASSWORD，请在服务器本机查看。"
    check_docker_app_ip
    echo "Webmail 对外地址: $base_url；HTTPS 地址需要先添加对应反向代理。"
    echo "请在后台添加邮件域名并配置 A/MX/SPF/DKIM/DMARC、PTR，放行邮件端口并确认服务商允许 25 端口。"
    echo "SMTP 465/587 需要真实 TLS 证书；证书存放在 $app_dir/certs，并在 .env 设置 LANQIN_TLS_CERT_FILE/LANQIN_TLS_KEY_FILE。"
    echo "证书续期后需同步 certs 中的文件，并运行 docker compose restart。邮件 DNS 应使用仅 DNS 解析。"
}

docker_app_update() {
    lanqin_email_owned_dir || return 1
    cd /home/docker/lanqin-email || return 1
    [ -f .env ] && [ -f docker-compose.yml ] || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    lanqin_email_wait_ready || return 1
    echo "LanQin Email 更新完成，原有配置、密钥和邮件数据已保留。"
}

docker_app_uninstall() {
    lanqin_email_owned_dir || return 1
    cd /home/docker/lanqin-email || return 1
    [ -f docker-compose.yml ] || return 1
    docker compose down --rmi all || return 1
    cd /home/docker || return 1
    rm -rf -- /home/docker/lanqin-email || return 1
    echo "LanQin Email 已卸载，配置和邮件数据已清理。"
}

docker_app_plus
