# --- 基础信息 / Basic Information ---
local app_id="monitor"
local app_name="Monitor Probe"
local app_text="极简探针 Rust 编写的轻量级服务器探针，支持实时监控、流量统计与掉线通知"
local app_url="https://github.com/monitor-probe/monitor"
local docker_name="monitor"
local docker_port="28080"
local app_size="1"

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local app_dir="/home/docker/monitor"
    mkdir -p "${app_dir}/data"
    chown -R 65534:65534 "${app_dir}/data"
    cd "${app_dir}" || return 1

    cat <<EOF > docker-compose.yml
services:
  monitor:
    image: stqfdyr/monitor:latest
    container_name: ${docker_name}
    restart: unless-stopped
    ports:
      - "${docker_port}:28080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
EOF

    docker compose up -d
    echo "安装完成 / Install Complete"
    check_docker_app_ip
    echo "首次登录的应急密码：docker logs ${docker_name} 2>&1 | grep Emergency"
    echo "登录后台后，请按节点页面给出的命令在被监控服务器上安装 Agent。"
}

docker_app_update() {
    local app_dir="/home/docker/monitor"
    cd "${app_dir}" || return 1
    docker compose pull
    docker compose up -d
    echo "更新完成 / Update Complete"
}

docker_app_uninstall() {
    local app_dir="/home/docker/monitor"
    cd "${app_dir}" || return 1
    docker compose down --rmi all
    rm -rf "${app_dir}"
    echo "卸载完成 / Uninstall Complete"
}

