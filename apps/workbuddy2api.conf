# WorkBuddy2API + Manager, deployed with macsur/WorkBuddy's reviewed installer.
local app_id="workbuddy2api"
local app_name="WorkBuddy2API + Manager"
local app_text="第三方 CodeBuddy 账号池 API 网关与管理面板（仅本机监听）"
local app_url="https://github.com/macsur/WorkBuddy"
local docker_name="workbuddy-manager"
local docker_port="7864"
local app_size="4"

workbuddy2api_app_dir() {
    printf '%s\n' /home/docker/workbuddy2api
}

workbuddy2api_deploy() {
    local app_dir script_file actual_hash status source_dir compose_file manager_port="$1"
    local revision="df7102b2f60c21313662794a2f57fb0182ef2d02"
    local expected_hash="eb3befa2063f5ceef708050a7721fd3ba6fab9c3bad4dd5d5f8d46016e46258a"

    app_dir="$(workbuddy2api_app_dir)"
    if ! [[ "$manager_port" =~ ^[0-9]+$ ]] ||
       [ "$manager_port" -lt 1 ] || [ "$manager_port" -gt 65535 ]; then
        echo "WorkBuddy2API 管理端口无效: $manager_port" >&2
        return 1
    fi
    # The upstream installer removes non-Git source directories before cloning.
    # Preserve unexpected files and let the operator resolve an incomplete install.
    for source_dir in "$app_dir/workbuddy2api" "$app_dir/workbuddy-manager"; do
        if [ -L "$source_dir" ]; then
            echo "源码目录是符号链接，拒绝写入: $source_dir" >&2
            return 1
        fi
        if [ -e "$source_dir" ] && [ ! -d "$source_dir/.git" ]; then
            echo "源码目录已存在但不是 Git 仓库，拒绝覆盖: $source_dir" >&2
            return 1
        fi
    done

    script_file="$(mktemp /tmp/workbuddy2api-deploy.XXXXXX)" || return 1
    if ! curl -fsSL --connect-timeout 10 --max-time 60 --retry 2 \
        -o "$script_file" \
        "${gh_proxy:-https://}raw.githubusercontent.com/macsur/WorkBuddy/${revision}/workbuddy-deploy.sh"; then
        rm -f -- "$script_file"
        echo "下载 WorkBuddy2API 部署脚本失败" >&2
        return 1
    fi
    actual_hash="$(sha256sum "$script_file" | awk '{print $1}')" || {
        rm -f -- "$script_file"
        return 1
    }
    if [ "$actual_hash" != "$expected_hash" ] || ! bash -n "$script_file"; then
        rm -f -- "$script_file"
        echo "WorkBuddy2API 部署脚本校验失败，已停止安装" >&2
        return 1
    fi

    # Leave domain and certificate management to kejilion.sh's reverse proxy.
    # Images still update; do not let the upstream script reset local source edits.
    DOMAIN= API_DOMAIN= SYNC_CODE=0 MANAGER_PORT="$manager_port" \
        REPO_UP="${gh_proxy:-https://}github.com/HanawaBanana/workbuddy2api.git" \
        REPO_MG="${gh_proxy:-https://}github.com/yys9253462-gif/workbuddy-manager.git" \
        bash "$script_file" --base-dir "$app_dir" --auto
    status=$?
    rm -f -- "$script_file"
    # Both generated Compose files contain credentials. Restrict them even if
    # deployment stopped after writing one of the files.
    for compose_file in "$app_dir/workbuddy2api/docker-compose.yml" \
                        "$app_dir/workbuddy-manager/docker-compose.yml"; do
        if [ -f "$compose_file" ]; then
            chmod 0600 "$compose_file" || return 1
        fi
    done
    return "$status"
}

docker_app_install() {
    local app_dir container
    app_dir="$(workbuddy2api_app_dir)"
    if [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入: $app_dir" >&2
        return 1
    fi
    if [ -e "$app_dir" ]; then
        if [ ! -f "$app_dir/.kejilion-app" ]; then
            echo "安装目录已存在且不属于本应用: $app_dir" >&2
            return 1
        fi
    else
        for container in workbuddy2api workbuddy-manager; do
            if docker container inspect "$container" >/dev/null 2>&1; then
                echo "容器 $container 已存在，拒绝覆盖已有部署" >&2
                return 1
            fi
        done
        mkdir -p -- "$app_dir" || return 1
        : > "$app_dir/.kejilion-app" || return 1
    fi
    if ! docker network inspect wbnet >/dev/null 2>&1; then
        : > "$app_dir/.kejilion-created-wbnet" || return 1
    fi

    workbuddy2api_deploy "$docker_port" || return 1
    echo "WorkBuddy2API 管理面板仅监听本机 127.0.0.1:${docker_port}。"
    echo "需要公网访问时，请在 kejilion.sh 建站菜单中添加 HTTPS 反向代理。"
    echo "初始凭据保存在 $app_dir/.credentials，请勿公开。"
}

docker_app_update() {
    local app_dir manager_port
    app_dir="$(workbuddy2api_app_dir)"
    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ] ||
       [ ! -f "$app_dir/.credentials" ]; then
        echo "未找到本应用的安装记录，拒绝更新" >&2
        return 1
    fi
    manager_port="$docker_port"
    if [ -f /home/docker/workbuddy-manager_port.conf ]; then
        manager_port="$(cat /home/docker/workbuddy-manager_port.conf)" || return 1
    fi
    workbuddy2api_deploy "$manager_port"
}

docker_app_uninstall() {
    local app_dir network_members
    app_dir="$(workbuddy2api_app_dir)"
    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ] ||
       [ -L "$app_dir/workbuddy2api" ] || [ -L "$app_dir/workbuddy-manager" ] ||
       [ ! -f "$app_dir/workbuddy2api/docker-compose.yml" ] ||
       [ ! -f "$app_dir/workbuddy-manager/docker-compose.yml" ]; then
        echo "安装目录不完整或不属于本应用，拒绝卸载" >&2
        return 1
    fi

    docker compose -f "$app_dir/workbuddy-manager/docker-compose.yml" down --rmi all || return 1
    docker compose -f "$app_dir/workbuddy2api/docker-compose.yml" down --rmi all || return 1
    if [ -f "$app_dir/.kejilion-created-wbnet" ] &&
       docker network inspect wbnet >/dev/null 2>&1; then
        network_members="$(docker network inspect wbnet --format '{{len .Containers}}')" || return 1
        if [ "$network_members" = "0" ]; then
            docker network rm wbnet >/dev/null || return 1
        fi
    fi
    rm -rf -- "$app_dir" || return 1
    echo "WorkBuddy2API 已卸载。独立配置的域名反代需在建站菜单中删除。"
}

docker_app_plus
