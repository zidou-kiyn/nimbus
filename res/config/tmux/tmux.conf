# Nimbus tmux 配置（来源: https://github.com/zidou-kiyn/nimbus/blob/main/res/config/tmux/tmux.conf）
# 注: tmux < 3.5 安装时会自动去掉 extended-keys-format 一行

# 固定用 bash，避免 server 被 cron(SHELL=/bin/sh) 拉起时新窗口全变成 dash
set -g default-shell /bin/bash
set -g mouse on
set -g mode-keys vi

# ---- 性能 / 兼容性（pi 等 TUI 程序）----
# 外层终端(xterm*)支持真彩色和同步刷新；若出现花屏，可去掉 :sync
set -as terminal-features 'xterm*:RGB:sync'
set -s focus-events on
set -g history-limit 50000
# pi 官方推荐：tmux 3.5+ 区分 Shift+Enter / Ctrl+Enter / Enter
set -s extended-keys on
set -s extended-keys-format csi-u

# ---- 剪贴板 ----
# on：允许 pane 内程序（如 pi 的 Ctrl+X）发出的 OSC 52 透传到外层终端(Termius)剪贴板
#     （external 会拦截程序发的 OSC 52，只允许 tmux 自己复制时写剪贴板）
set -s set-clipboard on

# ---- 鼠标 ----
# 规则：只有 Alt + 拖动 才会选择并复制；普通拖动（含手机上滑）不选不复制
# @drag_copy = 1 表示当前这次拖动是 Alt 拖动
set -gw @drag_copy 0

# 普通单击：只切换 pane（事件照常交给程序）
bind -T root MouseDown1Pane \
    select-pane -t= \; \
    send-keys -M

# 普通拖动：tmux 不处理（程序开启鼠标时，事件交给程序，如 pi fullscreen 选择）
unbind -T root MouseDrag1Pane

# Alt + 拖动（普通界面）：
#   程序自己开启了鼠标（如 pi fullscreen）-> tmux 不处理，交给程序
#   否则 -> 进入复制模式并开始选择
bind -T root M-MouseDrag1Pane {
    if -F '#{mouse_any_flag}' {
        send-keys -M
    } {
        select-pane -t=
        set -w @drag_copy 1
        copy-mode -M
    }
}

# 滚轮向上：
#   程序自己开启了鼠标 / 处于备用屏幕 / 已在复制模式 -> 把滚轮交给它（如 pi fullscreen）
#   否则 -> 进入 tmux 历史复制模式
bind -T root WheelUpPane {
    if -F '#{||:#{pane_in_mode},#{||:#{mouse_any_flag},#{alternate_on}}}' {
        send-keys -M
    } {
        select-pane -t=
        copy-mode -e
        send-keys -M
    }
}

# 复制模式中滚轮每格 3 行（默认 5 行，更细腻）
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 3 scroll-down

# 复制模式中普通拖动：像触屏一样滚动历史（不选择、不复制）
#   按下时记录行号 @drag_y；拖动时按位移滚动：手指往下拖 -> 看更早的内容
bind -T copy-mode-vi MouseDown1Pane select-pane \; set -pF @drag_y '#{mouse_y}'
bind -T copy-mode    MouseDown1Pane select-pane \; set -pF @drag_y '#{mouse_y}'
bind -T copy-mode-vi MouseDrag1Pane {
    select-pane
    if -F '#{e|>:#{mouse_y},#{@drag_y}}' {
        run -C 'send -X -N #{e|-:#{mouse_y},#{@drag_y}} scroll-up'
    } {
        if -F '#{e|<:#{mouse_y},#{@drag_y}}' {
            run -C 'send -X -N #{e|-:#{@drag_y},#{mouse_y}} scroll-down'
        }
    }
    set -pF @drag_y '#{mouse_y}'
}
bind -T copy-mode MouseDrag1Pane {
    select-pane
    if -F '#{e|>:#{mouse_y},#{@drag_y}}' {
        run -C 'send -X -N #{e|-:#{mouse_y},#{@drag_y}} scroll-up'
    } {
        if -F '#{e|<:#{mouse_y},#{@drag_y}}' {
            run -C 'send -X -N #{e|-:#{@drag_y},#{mouse_y}} scroll-down'
        }
    }
    set -pF @drag_y '#{mouse_y}'
}

# 复制模式中 Alt + 拖动：开始选择
bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; set -w @drag_copy 1 \; send -X begin-selection
bind -T copy-mode    M-MouseDrag1Pane select-pane \; set -w @drag_copy 1 \; send -X begin-selection

# 松开鼠标（无论松开时是否还按着 Alt）：
#   Alt 拖动 -> 复制，留在复制模式继续选（按 q 退出）
#   其他     -> 不复制
bind -T copy-mode-vi MouseDragEnd1Pane   if -F '#{==:#{@drag_copy},1}' 'send -X copy-selection ; set -w @drag_copy 0' 'send -X clear-selection'
bind -T copy-mode-vi M-MouseDragEnd1Pane if -F '#{==:#{@drag_copy},1}' 'send -X copy-selection ; set -w @drag_copy 0' 'send -X clear-selection'
bind -T copy-mode    MouseDragEnd1Pane   if -F '#{==:#{@drag_copy},1}' 'send -X copy-selection ; set -w @drag_copy 0' 'send -X clear-selection'
bind -T copy-mode    M-MouseDragEnd1Pane if -F '#{==:#{@drag_copy},1}' 'send -X copy-selection ; set -w @drag_copy 0' 'send -X clear-selection'

# 双击 / 三击：
#   复制模式中 -> 退出复制模式（同 q），不复制
#   普通界面   -> 程序开启了鼠标就交给程序（如 pi），否则什么都不做（不再默认复制词/行）
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X cancel
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X cancel
bind -T copy-mode    TripleClick1Pane select-pane \; send -X cancel
bind -T root DoubleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }
bind -T root TripleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }
