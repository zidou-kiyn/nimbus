# Nimbus tmux 配置 — https://github.com/zidou-kiyn/nimbus/blob/main/res/config/tmux/tmux.conf
# 鼠标: Alt+拖动=复制 | 滚轮=翻历史 | 复制模式中拖动=滚动 | 双击=退出复制模式 | prefix+m=开关鼠标

# ---- 基础 ----
set -g default-shell /bin/bash
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000
set -g renumber-windows on
set -g detach-on-destroy off
set -s escape-time 10
set -s focus-events on

# ---- 终端 / pi ----
set -as terminal-features 'xterm*:RGB:sync'
set -s extended-keys on
set -s extended-keys-format csi-u
set -s set-clipboard on
set-environment -g PI_CLIPBOARD_OSC52 1

# 临时关闭鼠标，用终端原生选择（Termius 手机端/不方便按 Shift 时）
bind m set -g mouse \; display 'mouse: #{?mouse,on,off}'

# ---- 鼠标: 普通界面 ----
set -gw @drag_copy 0
unbind -T root MouseDrag1Pane
bind -T root MouseDown1Pane select-pane -t= \; send-keys -M

bind -T root M-MouseDrag1Pane {
    if -F '#{mouse_any_flag}' { send-keys -M } {
        select-pane -t=
        set -w @drag_copy 1
        copy-mode -M
    }
}
bind -T root WheelUpPane {
    if -F '#{||:#{pane_in_mode},#{||:#{mouse_any_flag},#{alternate_on}}}' { send-keys -M } {
        select-pane -t=
        copy-mode -e
        send-keys -M
    }
}
bind -T root DoubleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }
bind -T root TripleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }

# ---- 鼠标: 复制模式 ----
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down

bind -T copy-mode-vi MouseDown1Pane select-pane \; set -pF @drag_y '#{mouse_y}'
bind -T copy-mode-vi MouseDrag1Pane {
    select-pane
    if -F '#{e|>:#{mouse_y},#{@drag_y}}' {
        run -C 'send -X -N #{e|-:#{mouse_y},#{@drag_y}} scroll-up'
    } {
        if -F '#{e|<:#{mouse_y},#{@drag_y}}' {
            run -C 'send -X -N #{e|-:#{@drag_y},#{mouse_y}} scroll-down'
        }
    }
    set -pF @drag_y '#{mouse_y}'
}

bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; set -w @drag_copy 1 \; send -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane   if -F '#{==:#{@drag_copy},1}' 'send -X copy-selection ; set -w @drag_copy 0' 'send -X clear-selection'
bind -T copy-mode-vi M-MouseDragEnd1Pane if -F '#{==:#{@drag_copy},1}' 'send -X copy-selection ; set -w @drag_copy 0' 'send -X clear-selection'

bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X cancel
